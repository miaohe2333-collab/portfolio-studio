<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Portfolio Studio</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <canvas id="galaxy"></canvas>

  <header id="toolbar">
    <div class="brand">✦ Portfolio&nbsp;<b>Studio</b></div>
    <div id="pageTabs" class="page-tabs"></div>
    <button id="addPageBtn" class="tab-add" title="新建页面">＋</button>
    <div class="spacer"></div>
    <div class="tool-group">
      <button id="undoBtn" title="撤销 (Ctrl+Z)">↶</button>
      <button id="redoBtn" title="重做 (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="tool-group">
      <select id="bgSelect" title="背景效果">
        <option value="flowers">🌸 花谷</option>
        <option value="galaxy">✦ 星系</option>
      </select>
      <button id="soundBtn" class="icon-btn" title="环境音" aria-pressed="false">🔇</button>
    </div>
    <div class="tool-group">
      <button id="previewBtn" title="预览 (P)">预览</button>
      <button id="importBtn" title="导入项目">导入</button>
      <button id="exportBtn" title="导出项目">导出</button>
    </div>
  </header>

  <main id="workspace">
    <aside id="assetsPanel" class="panel">
      <div class="panel-head"><span>素材库</span><button id="uploadBtn" class="mini">上传</button></div>
      <div id="assetGrid" class="asset-grid"></div>
      <div id="assetDrop" class="drop-hint">拖拽透明 PNG 到此<br>或点击「上传」</div>
    </aside>

    <section id="stage">
      <div id="canvasWrap"><div id="canvas"></div></div>
    </section>

    <aside id="layersPanel" class="panel">
      <div class="panel-head"><span>图层</span></div>
      <div id="layerList" class="layer-list"></div>
      <div class="panel-foot">拖动调整层级 · 双击重命名</div>
    </aside>
  </main>

  <div id="previewExit" class="preview-exit">✕ 退出预览 (Esc)</div>
  <input id="fileInput" type="file" accept="image/*" multiple hidden>
  <input id="projectInput" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
